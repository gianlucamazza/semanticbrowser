# cargo-deny configuration. Run: `cargo deny check`
# Schema: cargo-deny >= 0.14 (graph/output use defaults).

[advisories]
# Fail on any security advisory; warn on unmaintained/yanked crates.
version = 2
yanked = "warn"
ignore = []

[bans]
# Multiple versions of the same crate are noise, not errors.
multiple-versions = "warn"
wildcards = "allow"
# Crates we never want back in the tree.
deny = [
  # Unmaintained embedded DB, previously declared but unused. Use oxigraph's
  # RocksDB backend if KG persistence is needed.
  { name = "sled" },
]

[licenses]
version = 2
# Permissive licenses compatible with this MIT-licensed project.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
