name: Docs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install MkDocs
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt

    - name: Build documentation
      # NOTE: not --strict. The docs have long-standing broken internal links and
      # out-of-tree references (CONTRIBUTING.md, .env.example, LICENSE, src/llm/README.md)
      # that strict mode rejects. Re-enable --strict after a dedicated docs link cleanup.
      run: mkdocs build

    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-site
        path: site/